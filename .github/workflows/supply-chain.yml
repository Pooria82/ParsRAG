name: Supply chain

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements-runtime.txt -c requirements.lock

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag parsrag:scan .
      - uses: anchore/sbom-action@v0
        with:
          image: parsrag:scan
          format: spdx-json
          output-file: parsrag.spdx.json
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: parsrag:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: parsrag-sbom
          path: parsrag.spdx.json
