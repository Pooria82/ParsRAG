name: Quality

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -c requirements.lock
      - run: python -m ruff format --check backend backend/tests
      - run: python -m ruff check backend backend/tests
      - run: python -m mypy backend --strict
      - run: python -m pytest --cov=backend --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ matrix.os }}
          path: coverage.xml

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium
      - if: matrix.os == 'ubuntu-latest'
        run: npm run test:e2e
      - if: matrix.os == 'ubuntu-latest'
        run: npm run test:pwa

  end-to-end:
    # Real parsing, multilingual-e5 embeddings, Qdrant, reranking, and SSE
    # streaming; a deterministic model stands in for the LLM.
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt -c requirements.lock
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/flashrank
          key: e2e-models-${{ hashFiles('backend/infrastructure/llm/reranker.py') }}-e5-base
      - run: python -m pytest backend/tests/e2e --no-cov -v
        env:
          PARSRAG_E2E: "1"
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          EMBED_DEVICE: cpu
          HF_HUB_DISABLE_XET: "1"

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build --tag parsrag:ci .
      - name: Import the application inside the image
        run: docker run --rm --entrypoint python parsrag:ci -c "import backend.main"
