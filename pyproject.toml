[project]
name = "parsrag"
version = "1.0.0"
description = "Offline-first Persian (Farsi) and English RAG workspace for chatting with documents using local LLMs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Pooria Madani" }]
keywords = [
  "persian",
  "farsi",
  "rag",
  "retrieval-augmented-generation",
  "document-qa",
  "ocr",
  "ollama",
  "llamaindex",
  "qdrant",
  "local-llm",
]
classifiers = [
  "License :: Other/Proprietary License",
  "Natural Language :: English",
  "Natural Language :: Persian",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/Pooria82/ParsRAG"
Documentation = "https://github.com/Pooria82/ParsRAG/blob/main/ARCHITECTURE.md"
Repository = "https://github.com/Pooria82/ParsRAG"
Issues = "https://github.com/Pooria82/ParsRAG/issues"
Changelog = "https://github.com/Pooria82/ParsRAG/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["frontend", "scratch", "testData"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "UP", "RUF", "SIM", "C90", "D101", "D102", "D107", "D417"]
ignore = ["RUF001"] # Persian strings intentionally contain Arabic-script confusables.

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
omit = ["backend/tests/*"]
