[project]
name = "parsrag"
version = "1.0.0"
description = "Offline-first Persian document conversation workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["frontend", "scratch", "testData"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "UP", "RUF", "SIM", "C90", "D101", "D102", "D107", "D417"]
ignore = ["RUF001"] # Persian strings intentionally contain Arabic-script confusables.

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["backend"]

[[tool.mypy.overrides]]
# PyMuPDF's partial annotations leave core calls untyped; treat it as dynamic,
# as the former ``fitz`` alias was, and type the used surface via Protocols.
module = ["pymupdf"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
omit = ["backend/tests/*"]
